main{width:min(100%,460px);display:flex;flex-direction:column;align-items:center}

h1{font-family:Georgia,'Times New Roman',serif;font-size:34px;letter-spacing:7px;margin:0 0 10px;font-weight:500}
.tag{margin:0;color:var(--muted);font-size:13px;letter-spacing:2px;text-transform:uppercase}
.links{width:100%;display:grid;gap:12px;margin-top:18px}
a.link{display:flex;align-items:center;gap:15px;text-decoration:none;color:#fff;background:rgba(16,16,16,.94);border:1px solid var(--line);border-radius:16px;padding:15px 17px;transition:.2s transform,.2s border-color,.2s background}
a.link:hover{transform:translateY(-2px);border-color:#555;background:#141414}
.icon{width:42px;height:42px;flex:0 0 42px;border:1px solid #343434;border-radius:12px;display:grid;place-items:center;background:#090909}
.icon svg{width:21px;height:21px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.copy{flex:1;text-align:left}.title{font-size:15px;font-weight:700;letter-spacing:.3px}.sub{font-size:12px;color:#858585;margin-top:4px}
.arrow{color:#777;font-size:21px;padding-left:6px}
.note{font-size:11px;color:#666;text-align:center;line-height:1.6;margin:25px 15px 10px}
footer{color:#555;font-size:11px;letter-spacing:1px;text-align:center;padding:10px}
@media(max-width:380px){h1{font-size:29px;letter-spacing:5px}.link{padding:13px!important}}
